
name: Clement Family Office AWS Lambda Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Extract AWS Application ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted-aws

          unzip -q CLEMENT_FAMILY_OFFICE_AWS.zip \
            -d extracted-aws

          echo "Extracted application files:"
          find extracted-aws -maxdepth 3 -type f \
            | head -80

      - name: Connect GitHub to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::944870884457:role/GitHub_Cloud_Deployment_Automation_Role
          aws-region: us-east-2

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Inspect Lambda Application
        shell: bash
        run: |
          aws lambda get-function-configuration \
            --function-name soln-visa-connection-bridge \
            --region us-east-2 \
            --query '{Runtime:Runtime,Handler:Handler,State:State,PackageType:PackageType}'

      - name: Check Extracted Application
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Lambda source files..."

          find extracted-aws -type f \
            \( -name 'lambda_function.py' \
            -o -name 'index.js' \
            -o -name 'index.mjs' \
            -o -name 'app.js' \)

          echo "Extraction and inspection completed."
