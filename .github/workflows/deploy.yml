name: Automated Cloud-to-Cloud Deployment Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  DeployInfrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Authenticate Securely with AWS Infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::944870884457:role/GitHub_Cloud_Deployment_Automation_Role
          aws-region: us-east-2

      - name: Deploy Live Lambda Engine Updates
        run: |
          # 1. Create a lightweight production deployment package ignoring metadata and environments
          zip -r function.zip . -x "*.git*" "*.github*" "README.md" "tests/*"
          
          # 2. Trigger the code binary compilation modification directly inside AWS storage systems
          aws lambda update-function-code \
            --function-name soln-visa-connection-bridge \
            --zip-file fileb://function.zip
            
          # 3. Synchronous Block: Wait for the asynchronous state change to flip to Active
          echo "Waiting for Lambda function code deployment optimization to finish..."
          aws lambda wait function-updated --function-name soln-visa-connection-bridge
          echo "Deployment successfully confirmed!"
