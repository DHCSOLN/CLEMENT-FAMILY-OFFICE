if(page==='Trust jurisdictions')out=head('Delaware & the generations.','Compare governing law, trust administration and federal transfer-tax planning.',btn('Add trust plan','editTrustPlan()'))+`<div class="notice">CLCLLC is registered in Delaware per the owner’s October 17 confirmation; registry certificate verification is pending. Delaware trust situs remains a separate planning review. No trust has been moved, amended or formed by this app. Existing executed instruments and applicable law determine who can authorize changes. CLCLLC’s management role does not automatically replace the trustee’s duties or title to trust property.</div><div class="split"><div class="card"><h2>Long-duration trust property</h2><p class="muted">Delaware law removes perpetuity limits for personal property held in trust. This can matter for company shares, LLC interests and other personal property in multigenerational planning. Directly held real estate generally has a separate 110-year rule, subject to statutory exceptions. Entity interests and direct land holdings require separate treatment.</p><a href="https://delcode.delaware.gov/title25/c005/index.html" target="_blank" rel="noopener">25 Del. C. §503 ↗</a></div><div class="card"><h2>Federal generation-skipping tax</h2><p class="muted">GST is a federal transfer-tax framework, not a Delaware exemption. Tax analysis considers the transferor, generation assignments, transfers, exemption allocations, elections and the trust’s inclusion ratio. The family’s generation labels in this app are not a tax determination.</p><a href="https://www.irs.gov/instructions/i709" target="_blank" rel="noopener">IRS Form 709 instructions ↗</a></div></div><div class="card"><h2>Trust planning register</h2><div class="tablewrap"><table><tr><th>Trust</th><th>Current law / situs</th><th>Target / administration</th><th>GST review</th><th></th></tr>${state.trustPlans.map((t,i)=>`<tr><td>${esc(t.trust)}<div class="mini">${esc(t.type)}</div></td><td>${esc(t.currentLa function legacyAlerts(){const a=[];const today=new Date().toISOString().slice(0,10);if(!state.documents.length)a.push({level:'Action needed',title:'Signed legacy documents are not linked in the active register',detail:'The private source archive contains retrieved instruments. Upload or classify authoritative signed versions here to track active amendments, reviews and dependencies.'});state.documents.forEach((d,i)=>{if(d.integrityIssue)a.push({level:'Integrity alert',title:d.title+' fingerprint mismatch',detail:d.integrityIssue,index:i});if(d.status==='Superseded')return;const push=(level,title,detail)=>a.push({level,title,detail,index:i});if(!d.category||d.category==='Unclassified'||!d.entity&&!d.trust)push('Organization','Classify and link '+d.title,'Assign its document type and related entity or trust so it can be reviewed in context.');if(d.reviewDate&&d.reviewDate<today)push('Review overdue',d.title+' is due for review','The recorded review date has passed. Record a new review and evidence after completing it.');if(d.expiryDate&&d.expiryDate<today)push('Expired date',d.title+' has a past expiry date','Confirm whether renewal, replacement or another action is required; an entered expiry date is not a legal determination.');const prev=state.documents.find(p=>p.id===d.previousId);if(d.previousId&&!prev)push('Broken link','Prior document version is missing','The predecessor identifier does not match a document in this register.');if(prev&&d.status!=='Approved'){if(prev.protectedBaseline==='Yes')push('Protection review','Protected baseline has a proposed replacement','Compare the retained original and proposed version before applying any change.');if((prev.keyClauses||'')!==(d.keyClauses||''))push('Clause change','Key-clause text differs from the prior version','A difference was detected in entered clause text. Have the appropriate reviewer assess its effect.');if(prev.trust&&d.trust!==prev.trust)push('Ownership / trust conflict','Trust association changed between function editLegacyDoc(i){const d=state.documents[i]||{};const f=(n,l,type='text')=>field(n,l,d[n],type);const options=state.documents.filter(x=>x.id!==d.id);const selects=options.map(x=>`<option value="${esc(x.id)}">${esc(x.title)} · ${esc(x.version||'unversioned')}</option>`).join('');form(i===undefined?'Upload a connected legacy document':'Manage document & review',f('title','Document title')+`<div class="formgrid">${select('category','Document category',['Trust deed','Trust amendment','Constitution / directive','Beneficiary / exclusion policy','Succession / appointment','Company agreement','Share register / issuance','Tax filing','Artwork / provenance','Custody / insurance','Contract','Other'],d.category)}${select('entity','Connected company / entity',['',...state.entities.map(e=>e.name)],d.entity)}${select('trust','Connected trust',['','Clement Dynasty Dynasty Trust','State of Loc Nation Trust'],d.trust)}${select('beneficiary','Related beneficiary',['',...state.beneficiaries.map(b=>b.name)],d.beneficiary)}${select('asset','Related asset',['',...state.assets.map(a=>a.name)],d.asset)}${f('version','Version / amendment identifier')}${f('effectiveDate','Effective / adoption date','date')}${f('reviewDate','Next review date','date')}${f('expiryDate','Expiry / renewal date (if applicable)','date')}${f('governingLaw','Governing law stated in the document')}${f('recordedOwner','Legal title holder stated in the document')}${f('reportedShares','Reported share total (optional)','number')}${select('protectedBaseline','Protected baseline',['No','Yes'],d.protectedBaseline)}${select('affectsProtections','Affects beneficiaries, exclusions, succession or protection?',['No','Yes','Unknown — review required'],d.affectsProtections)}${select('status','Review status',['Uploaded — review pending','In review','Approved','Superseded'],d.status)}${f('reviewer','Reviewer / authorized approving person')}</div>`+f('evidence','Approval / authority / professional review reference')+area('keyC  prev=state.documents.find(x=>x.id===data.previousId);record={...record,...uploaded,id:crypto.randomUUID(),groupId:prev?.groupId||crypto.randomUUID(),sha256,date:new Date().toISOString()};state.documents.push(record);}else state.documents[i]=record;await save('Saved legacy document: '+data.title);const count=legacyAlerts().length;if(count)toast(count+' legacy alerts need review')})}
async function checkFile(i){const d=state.documents[i];if(!d.sha256){toast('No original fingerprint recorded for this earlier upload');return}try{const r=await fetch(d.sourceId?'/api/website-file/'+encodeURIComponent(d.sourceId):'/api/file/'+encodeURIComponent(d.key));if(!r.ok)throw Error('Original file could not be retrieved');const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await r.arrayBuffer()))].map(b=>b.toString(16).padStart(2,'0')).join('');if(digest!==d.sha256){d.integrityIssue='Fingerprint mismatch detected '+new Date().toISOString();await save('Integrity alert: '+d.title);toast('ALERT: fingerprint differs from the saved original')}else toast('Fingerprint matches the saved original')}catch(e){toast(e.message)}}
function editExpansion(i){const x=state.expansionPlans[i]||{};const f=(n,l,type='text')=>field(n,l,x[n],type);form('Future endeavor',f('name','Endeavor name')+select('operator','Operating entity / sponsor',['New entity — formation review required',...state.entities.map(e=>e.name)],x.operator)+f('sector','Sector / service line')+f('country','Country / jurisdiction')+select('stage','Planning stage',['Idea','Research / diligence','Professional review','Approval recorded','Funding evidence recorded','Operating — evidence recorded','Paused'],x.stage)+f('capital','Capital budget · LND','number')+f('owner','Accountable lead')+f('targetDate','Target milestone date','date')+area('milestone','Next measurable milestone',x.milestone)+area('requirements','Professional, registration and operational requirements',x.requirements)+f('evidence','Approval / funding / operating evidence')+area('notes','Dependencies, risks and growth objectives',x.notes),async d=>{if(!d.name.trim())throw Error('Endeavor name required');if(['Approval recorded','Funding evidence recorded','Operating — evidence recorded'].includes(d.stage)&&!d.evidence.trim())throw Error('This stage requires an evidence reference');const record={...x,...d,id:x.id||crypto.randomUUID()};i===undefined?state.expansionPlans.push(record):state.expansionPlans[i]=record;await save('Updated future endeavor: '+d.name)})}
function editProgram(i){const p=state.philanthropyPrograms[i]||{};const f=(n,l,type='text')=>field(n,l,p[n],type);form('Ghana philanthropic program',f('name','Program name')+f('location','Community / location')+area('purpose','Charitable / public-benefit purpose',p.purpose)+f('audience','Public-benefit participants / eligibility')+f('owner','Accountable foundation lead')+f('budget','Approved / planned budget · LND','number')+select('localCurrency','Local expenditure currency',['GHS','USD','LND','Other'],p.localCurrency)+f('localSpend','Actual expenditure — original currency','number')+area('restrictions','Donor restrictions / grant terms / authorization',p.restrictions)+f('target','Measurable delivery target')+f('actual','Measured result / reporting period')+f('evidence','Board approval, grant, payment and outcome evidence')+area('notes','Safeguarding, local reporting and follow-up',p.notes),async d=>{if(!d.name.trim()||!d.purpose.trim())throw Error('Program name and public-benefit purpose required');const record={...p,...d,id:p.id||crypto.randomUUID()};i===undefined?state.philanthropyPrograms.push(record):state.philanthropyPrograms[i]=record;await save('Updated foundation program: '+d.name)})}
function addFamilyProspect(){form('Additional family planning record',field('label','Family label / planning identifier')+select('scope','Intended service scope',['Administrative services — define scope','Accounting / reporting — professional review','Investment advice — registration review','Combined scope — professional review'])+select('stage','Stage',['Planning only','Scope review','Professional review','Agreements under review'])+area('notes','Required agreements, segregation and readiness notes'),async d=>{if(!d.label.trim())throw Error('Family label required');state.familyProspects.push({...d,id:crypto.randomUUID()});await save('Added multi-family planning record: '+d.label)})}
function editBook(i){const b=state.books[i]||{};const f=(n,l)=>field(n,l,b[n]);form('Publication & rights record',f('title','Exact title / subtitle')+f('author','Author / contributors')+f('publisher','Publisher / imprint')+f('year','Publication year')+f('edition','Edition / version')+f('isbn','ISBN / ASIN')+f('lccn','LCCN / deposit reference')+f('source','Official catalog / publisher URL')+area('holding','What complete files or excerpts are held?',b.holding)+area('rights','Copyright / assignment / licensing details',b.rights)+f('evidence','Linked document / source / royalty evidence'),async d=>{if(!d.title.trim())throw Error('Title required');const record={...b,...d,id:b.id||crypto.randomUUID()};i===undefined?state.books.push(record):state.books[i]=record;await save('Updated publication: '+d.title)})}
async function registerSourceDocument(id){const x=[...websiteArchive.pages,...websiteArchive.assets,...(websiteArchive.trustReferences||[]),...(websiteArchive.familySources||[])].find(x=>x.id===id);if(!x||x.status!=='captured')return;const existing=state.documents.find(d=>d.sourceId===id);if(existing){$('#modal').close();page='Documents & alerts';render();editLegacyDoc(state.documents.indexOf(existing));return}const d={id:crypto.randomUUID(),groupId:crypto.randomUUID(),key:'',sourceId:x.id,name:x.filename||x.title||x.label,title:x.title||x.label,size:x.bytes,date:new Date().toISOString(),sha256:x.sha256,category:'Unclassified',status:'Uploaded — review pending',entity:'',trust:'',evidence:'Preserved source: '+(x.url||x.title),links:[],notes:'Registered from an already preserved source. Original bytes retained; classification and legal review remain pending.'};state.documents.push(d);try{await save('Connected preserved source to legacy register: '+d.title);$('#modal').close();page='Documents & alerts';render();editLegacyDoc(state.documents.length-1)}catch(e){toast(e.message)}}
function editEntity(i){const e=state.entities[i]||{};form('Enterprise & ownership',`<div class="formgrid">${field('name','Legal name',e.name)}${field('type','Legal form / role',e.type)}${field('jurisdiction','State / country of registration',e.jurisdiction)}${field('fileNumber','Registration / file number',e.fileNumber)}${field('formationDate','Formation date',e.formationDate,'date')}${field('registrationSource','Registry certificate / verification source',e.registrationSource)}${field('owner','Recorded holder',e.owner)}${field('className','Share / membership class',e.className)}${field('authorized','Authorized units / shares',e.authorized,'number')}${field('issuedActual','Issued units / shares',e.issuedActual,'number')}${field('treasury','Treasury / repurchased shares',e.treasury,'number')}${field('issued','Outstanding units / shares',e.issued,'number')}${field('held','Units / shares held',e.held,'number')}</div>${field('reportedCapital','Source-reported capital count / total',e.reportedCapital)}${field('capitalSource','Source and reporting date',e.capitalSource)}${field('evidence','Signed ownership evidence / reference',e.evidence)}${area('notes','Operating goals / management authority',e.notes)}`,async d=>{if(!d.name.trim())throw Error('Legal name required');if(d.held&&(!d.issued||+d.held>+d.issued||+d.issued<=0))throw Error('Held units must not exceed positive outstanding units');const record={...e,...d,id:e.id||crypto.randomUUID(),source:e.source||'Owner-entered · verification pending'};i===undefined?state.entities.push(record):state.entities[i]=record;await save('Updated enterprise: '+d.name)})}
function editTask(i){const t=state.tasks[i]||{};form('Professional workstream',field('title','Workstream',t.title)+field('role','Professional role',t.role)+area('detail','Deliverable',t.detail)+field('owner','Assigned person / firm',t.owner)+field('due','Target date',t.due,'date')+select('status','Status',['Open','In progress','Evidence recorded'],t.status)+field('evidence','Completion evidence / review reference',t.evidence),async d=>{if(!d.title.trim())throw Error('Title required');if(d.status==='Evidence recorded'&&!d.evidence.trim())throw Error('Completion requires an evidence reference');const record={...t,...d,id:t.id||crypto.randomUUID(),kind:t.kind||'Owner-defined completion item',source:t.source??0};i===undefined?state.tasks.push(record):state.tasks[i]=record;await save('Updated workstream: '+d.title)})}
function editBeneficiary(id){const b=state.beneficiaries.find(b=>b.id===id);form('Beneficiary growth & succession',field('name','Full name',b.name)+field('relation','Relationship',b.relation)+field('generation','Generation',b.generation)+field('status','Eligibility / designation status',b.status)+field('instrument','Governing instrument / entitlement reference',b.instrument)+area('goals','Measurable education, health, business and financial goals',b.goals)+field('successor','Successor / guardian reference',b.successor)+field('review','Next goal review',b.review,'date'),async d=>{if(!d.name.trim()||!d.instrument.trim())throw Error('Name and instrument reference required');Object.assign(b,d);await save('Updated beneficiary goals: '+d.name)})}
function addBeneficiary(){form('Beneficiary profile',field('name','Full name')+`<div class="formgrid">${field('relation','Family relationship')}${field('generation','Generation')}${select('status','Eligibility',['Pending instrument review','Eligible per recorded instrument','Not currently eligible'])}${field('review','Next review','', 'date')}</div>`+field('instrument','Governing trust / eligibility provision')+field('successor','Guardian / successor contact reference')+area('goals','Education, health, business and development goals'),async d=>{if(!d.name.trim()||!d.instrument.trim())throw Error('Name and governing instrument required');state.beneficiaries.push({...d,id:crypto.randomUUID()});await save('Added beneficiary: '+d.name)})}
function addAsset(){form('Family asset',field('name','Asset name')+field('owner','Legal title holder')+select('category','Category',['Intellectual property','Business interest','Art / collectible','Real property','Cash / investment','Claim — recognition pending','Other'])+field('value','Documented value in LND (optional)','','number')+field('basis','Valuation method / date / appraiser')+field('evidence','Title and valuation evidence'),async d=>{if(!d.name.trim()||!d.owner.trim())throw Error('Asset and owner required');state.assets.push({...d,id:crypto.randomUUID()});await save('Added asset: '+d.name)})}
function addTransaction(){form('Internal LND entry',select('type','Entry type',['Allocation','Distribution'])+field('date','Record date',new Date().toISOString().slice(0,10),'date')+field('account','Entity / beneficiary account')+field('amount','LND amount','','number')+field('purpose','Purpose')+field('evidence','Authorization / transaction evidence'),async d=>{if(!(Number(d.amount)>0)||!d.account.trim()||!d.evidence.trim())throw Error('Positive amount, account and evidence required');state.transactions.push({...d,id:crypto.randomUUID()});await save('Recorded internal LND '+d.type.toLowerCase())})}
function editConstitution(){form('Authoritative constitution text',field('version','Version / adoption date / evidence',state.constitutionVersion)+area('text','Constitution text',state.constitution),async d=>{state.constitution=d.text;state.constitutionVersion=d.version;await save('Updated constitution text')})}
function uploadDoc(){form('Private document vault','<label>File (up to 100 MB)<input id="file" type="file" required></label>',async()=>{const f=$('#file').files[0];if(!f||f.size>104857600)throw Error('Choose a file up to 100 MB');const r=await fetch('/api/upload',{method:'POST',headers:{'X-File-Name':encodeURIComponent(f.name),'X-File-Size':String(f.size)},body:f});if(!r.ok)throw Error('Upload failed');const d=await r.json();state.documents.push({...d,date:new Date().toISOString()});await save('Uploaded document: '+f.name)})}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='clement-family-office-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}load().catch(e=>{$('#app').textContent='Unable to load the private workspace. '+e.message});
